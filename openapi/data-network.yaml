                      - type: 'null'
                  required:
                  - scheme
                  - value
              required:
              - identifier
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    enum:
                    - list
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        shipment:
                          type: string
                        path:
                          type: array
                          items:
                            type: object
                            properties:
                              scheme:
                                type: string
                                enum:
                                - tracking_number
                                - shipment
                                - sscc
                                - uld
                                - container
                                - awb
                                - postal_receptacle
                                - bag
                                - upstream_reference
                              value:
                                type: string
                              carrier:
                                anyOf:
                                - type: string
                                - type: 'null'
                            required:
                            - scheme
                            - value
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/identifier_links:
    post:
      tags:
      - Data Network
      operationId: identifier_links.create
      summary: Link identifiers
      parameters:
      - $ref: '#/components/parameters/ShippingVersion'
      - $ref: '#/components/parameters/ShippingAccount'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentifierLinkInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentifierLink'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      security:
      - apiKey: []
      - oauth2:
        - data:write
  /v1/milestone_definitions:
    get:
      tags:
      - Data Network
      operationId: milestone_definitions.retrieve
      summary: Milestone definition set
      parameters:
      - $ref: '#/components/parameters/ShippingVersion'
      - $ref: '#/components/parameters/ShippingAccount'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MilestoneDefinitions'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /.well-known/shipping-configuration:
    get:
      tags:
      - Discovery
      operationId: discovery.configuration
      summary: Shipping configuration document
      security: []
      servers:
      - url: https://api.example.com
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: true
webhooks:
  event:
    post:
      summary: Event delivery to a webhook endpoint
      parameters:
      - name: Shipping-Signature
        in: header
        required: true
        schema:
          type: string
        description: t=<unix>,v1=<hex hmac-sha256 of '{t}.{raw_body}'>[,v1a=<ed25519>]
      - name: Shipping-Event-Id
        in: header
        required: true
        schema:
          type: string
      - name: Shipping-Event-Type
        in: header
        required: true
        schema:
          type: string
      - name: Shipping-Delivery-Id
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        2XX:
          description: Acknowledged
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: sk_test_ / sk_live_ / rk_test_ / rk_live_ keys
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://api.example.com/oauth/authorize
          tokenUrl: https://api.example.com/oauth/token
          refreshUrl: https://api.example.com/oauth/token
          scopes:
            rates:read: rates:read
            shipments:read: shipments:read
            shipments:write: shipments:write
            pickups:read: pickups:read
            pickups:write: pickups:write
            manifests:read: manifests:read
            manifests:write: manifests:write
            documents:read: documents:read
            documents:write: documents:write
            trackers:read: trackers:read
            trackers:write: trackers:write
            webhooks:read: webhooks:read
            webhooks:write: webhooks:write
            connections:read: connections:read
            connections:write: connections:write
            inbound:read: inbound:read
            inbound:write: inbound:write
            trade:read: trade:read
            trade:write: trade:write
            catalog:read: catalog:read
            catalog:write: catalog:write
            pricing:read: pricing:read
            pricing:write: pricing:write
            routes:read: routes:read
            routes:write: routes:write
            fleet:read: fleet:read
            fleet:write: fleet:write
            injection:read: injection:read
            injection:write: injection:write
            accounts:read: accounts:read
            accounts:write: accounts:write
            products:read: products:read
            products:write: products:write
            network:read: network:read
            network:write: network:write
            iot:read: iot:read
            iot:write: iot:write
            data:read: data:read
            data:write: data:write
            consolidation:read: consolidation:read
            consolidation:write: consolidation:write
            templates:read: templates:read
            templates:write: templates:write
            integrations:read: integrations:read
            integrations:write: integrations:write
            jobs:read: jobs:read
            jobs:write: jobs:write
            billing:read: billing:read
            billing:write: billing:write
            inventory:read: inventory:read
            inventory:write: inventory:write
            openid: openid
            profile: profile
            email: email
        clientCredentials:
          tokenUrl: https://api.example.com/oauth/token
          scopes: {}
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://api.example.com/.well-known/openid-configuration
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    StartingAfter:
      name: starting_after
      in: query
      schema:
        type: string
    EndingBefore:
      name: ending_before
      in: query
      schema:
        type: string
    Expand:
      name: expand[]
      in: query
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema:
        type: string
        maxLength: 255
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 255
    ShippingVersion:
      name: Shipping-Version
      in: header
      schema:
        type: string
      example: '2026-10-01'
    ShippingAccount:
      name: Shipping-Account
      in: header
      schema:
        type: string
      description: Act on behalf of a connected account (acct_...)
    Query:
      name: query
      in: query
      required: true
      schema:
        type: string
      description: Search query language (chapter 10 §3)
    Page:
      name: page
      in: query
      schema:
        type: string
  responses:
    BadRequest:
      description: invalid_request_error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: authentication_error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: permission_error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: resource_missing
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: idempotency_error or state_error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CarrierError:
      description: carrier_error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: rate_limit_error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CarrierUnavailable:
      description: carrier_unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    CarrierMetadata:
      type: object
      properties: {}
      additionalProperties: true
      readOnly: true
      description: Read-only. Carrier-returned data not modelled by the spec (routing codes, internal IDs). Untrusted and unversioned; keys may
        change with the carrier's API.
    SystemMetadata:
      type: object
      properties:
        source:
          type: string
          enum:
          - api
          - dashboard
          - batch
          - inbound
          - automation
          - system
        created_by:
          type: object
          properties:
            type:
              type: string
              enum:
              - api_key
              - oauth_app
              - user
              - system
            id:
              type: string
        request_id:
          anyOf:
          - type: string
          - type: 'null'
        idempotency_key:
          anyOf:
          - type: string
          - type: 'null'
        batch:
          anyOf:
          - type: string
          - type: 'null'
        generated:
          type: boolean
        test_scenario:
          anyOf:
          - type: string
          - type: 'null'
      additionalProperties: true
      readOnly: true
      description: Read-only. Implementer provenance. Implementer-specific keys are prefixed x_.
    UserMetadata:
      type: object
      properties: {}
      additionalProperties:
        type: string
        maxLength: 500
      maxProperties: 50
      description: Client-writable. Up to 50 string key/value pairs. Never sent to carriers.
    Money:
      type: object
      properties:
        amount:
          type: integer
          description: Minor units (ISO 4217 exponent)
        currency:
          type: string
          pattern: ^[a-z]{3}$
          examples:
          - usd
      required:
      - amount
      - currency
    Weight:
      type: object
      properties:
        value:
          type: number
          exclusiveMinimum: 0
        unit:
          type: string
          enum:
          - g
          - kg
          - oz
          - lb
      required:
      - value
      - unit
    Dimensions:
      type: object
      properties:
        length:
          type: number
        width:
          type: number
        height:
          type: number
        unit:
          type: string
          enum:
          - mm
          - cm
          - in
      required:
      - length
      - width
      - height
      - unit
    Message:
      type: object
      properties:
        level:
          type: string
          enum:
          - info
          - warning
        code:
          type: string
        message:
          type: string
        param:
          type: string
        carrier:
          type: string
      required:
      - level
      - code
      - message
    Messages:
      type: array
      items:
        $ref: '#/components/schemas/Message'
    TaxId:
      type: object
      properties:
        type:
          type: string
          enum:
          - eori
          - vat
          - ioss
          - voec
          - gst
          - ein
          - ssn_last4
          - cpf
          - cnpj
          - rfc
          - abn
          - state_tax_id
          - other
        value:
          type: string
        country:
          type: string
      required:
      - type
      - value
    Address:
      type: object
      properties:
        line1:
          type: string
          description: Street. Street name only when street_number is set; otherwise street and number. No city/state/postal code.
        street_number:
          type: string
          description: House/building number incl. suffix (10, 221B, 12-14). Recommended for DE, NL, BE, AT, CH, PL, BR.
        line2:
          type: string
          description: Apartment, suite, floor, building, c/o
        city:
          type: string
        state:
          type: string
          description: ISO 3166-2 subdivision without country prefix
        postal_code:
          type: string
        country:
          type: string
          pattern: ^[A-Z]{2}$
        residential:
          anyOf:
          - type: boolean
          - type: 'null'
        validation:
          anyOf:
          - type: object
            properties:
              status:
                type: string
                enum:
                - verified
                - corrected
                - unverified
                - invalid
              suggested:
                $ref: '#/components/schemas/Address'
              messages:
                $ref: '#/components/schemas/Messages'
            readOnly: true
          - type: 'null'
      required:
      - line1
      - country
    Contact:
      type: object
      properties:
        name:
          type: string
        company:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          description: E.164
        tax_ids:
          type: array
          items:
            $ref: '#/components/schemas/TaxId'
        address:
          $ref: '#/components/schemas/Address'
        instructions:
          type: string
          maxLength: 255
        access_point:
          anyOf:
          - type: object
            properties:
              carrier:
                type: string
              id:
                type: string
              type:
                type: string
                enum:
                - locker
                - parcel_shop
                - post_office
          - type: 'null'
      description: A party to a shipment. Either `name` or `company` is required. `address` is required on ship_from, ship_to, return_to, bill_to.
    DangerousGoods:
      type: object
      properties:
        class:
          type: string
        un_number:
          type: string
          pattern: ^UN[0-9]{4}$
        proper_shipping_name:
          type: string
        packing_group:
          anyOf:
          - type: string
            enum:
            - I
            - II
            - III
          - type: 'null'
        packing_instruction:
          type: string
        section:
          type: string
        quantity:
          $ref: '#/components/schemas/Weight'
        lithium:
          anyOf:
          - type: object
            properties:
              type:
                type: string
                enum:
                - ion
                - metal
              configuration:
                type: string
                enum:
                - alone
                - packed_with_equipment
                - contained_in_equipment
              watt_hours:
                type: number
              lithium_grams:
                type: number
              cells:
                type: integer
          - type: 'null'
        accessibility:
          type: string
          enum:
          - accessible
          - inaccessible
        transport_mode:
          type: string
          enum:
          - air
          - ground
          - sea
        excepted_quantity:
          type: boolean
        limited_quantity:
          type: boolean
        emergency_contact:
          type: object
          properties:
            name:
              type: string
            phone:
              type: string
        declaration_document:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - class
      - un_number
    ItemCompliance:
      type: object
      properties:
        controlled:
          type: boolean
        control_type:
          type: string
          enum:
          - dual_use
          - military
          - sanctions
          - agricultural
          - pharmaceutical
          - cites
          - other
        eccn:
          type: string
        license:
          type: object
          properties:
            type:
              type: string
              enum:
              - export
              - import
            number:
              type: string
            expires_on:
              type: string
              format: date
        regulatory_agency:
          type: string
        regulatory_program:
          type: string
        regulatory_category_code:
          type: string
        certification:
          type: object
          properties:
            type:
              type: string
            reference:
              type: string
    Item:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        sku:
          type: string
        quantity:
          type: integer
          minimum: 1
        unit_value:
          $ref: '#/components/schemas/Money'
        unit_net_weight:
          $ref: '#/components/schemas/Weight'
          description: Weight of one unit of goods, excluding all packaging
        unit_gross_weight:
          $ref: '#/components/schemas/Weight'
          description: Weight of one unit including its retail packaging (not the shipping carton); >= unit_net_weight
        origin_country:
          type: string
          pattern: ^[A-Z]{2}$
        export_hs_code:
          type: string
          pattern: ^[0-9. ]{6,16}$
          description: Origin country's export classification (e.g. US Schedule B)
        import_hs_code:
          type: string
          pattern: ^[0-9. ]{6,16}$
          description: Destination country's import tariff classification (e.g. HTSUS, UK Trade Tariff, TARIC)
        category:
          type: string
        product_url:
          type: string
          format: uri
        image_url:
          type: string
          format: uri
        product_id:
          type: string
        variant_id:
          type: string
        order_line_id:
          type: string
        brand:
          type: string
        material:
          type: string
        manufacturer:
          type: object
          properties:
            name:
              type: string
            country:
              type: string
            mid:
              type: string
        compliance:
          anyOf:
          - $ref: '#/components/schemas/ItemCompliance'
          - type: 'null'
        dangerous_goods:
          anyOf:
          - $ref: '#/components/schemas/DangerousGoods'
          - type: 'null'
        product:
          anyOf:
          - type: string
            description: prod_ ID; fills unset fields, snapshotted at purchase
          - type: 'null'
        user_metadata:
          $ref: '#/components/schemas/UserMetadata'
      required:
      - quantity
    HandlingUnit:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        type:
          type: string
          enum:
          - parcel
          - envelope
          - tube
          - pallet
          - crate
          - skid
          - drum
          - carton
          - uld
          - container
          - other
          default: parcel
        conditions:
          anyOf:
          - type: object
            properties:
              temperature:
                type: object
                properties:
                  min:
                    type: object
                    properties:
                      value:
                        type: number
                      unit:
                        type: string
                  max:
                    type: object
                    properties:
                      value:
                        type: number
                      unit:
                        type: string
              shock:
                type: object
                properties:
                  max:
                    type: object
                    properties:
                      value:
                        type: number
                      unit:
                        type: string
              tilt:
                type: object
                properties:
                  max_degrees:
                    type: number
          - type: 'null'
        weight:
          $ref: '#/components/schemas/Weight'
        dimensions:
          $ref: '#/components/schemas/Dimensions'
        packaging:
          type: string
          description: Generic code (your_packaging, envelope, pak, tube, eur_pallet, us_pallet_48x40) or a carrier packaging code
        freight:
          anyOf:
          - type: object
            properties:
              pallet_standard:
                type: string
                enum:
                - eur1
                - eur2
                - us_48x40
                - au_1165
                - other
              stackable:
                type: boolean
              piece_count:
                type: integer
              freight_class:
                type: string
              nmfc_code:
                type: string
              hazmat_placard:
                type: boolean
          - type: 'null'
        reference:
          type: string
        description:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        tracking_number:
          type: string
          readOnly: true
        carrier_metadata:
          $ref: '#/components/schemas/CarrierMetadata'
      required:
      - weight
    OrderInvoice:
      type: object
      properties:
        number:
          type: string
        date:
          type: string
          format: date
        type:
          type: string
          enum:
          - commercial
          - proforma
        terms_of_payment:
          type: string
          enum:
          - prepaid
          - collect
          - free_of_charge
        file:
          anyOf:
          - type: string
          - type: 'null'
    Order:
      type: object
      properties:
        id:
          type: string
        reference:
          type: string
        channel:
          type: string
        ordered_at:
          type: string
          format: date-time
        currency:
          type: string
        subtotal:
          $ref: '#/components/schemas/Money'
        shipping_charge:
          $ref: '#/components/schemas/Money'
        insurance_charge:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        discount:
          $ref: '#/components/schemas/Money'
        tax:
          $ref: '#/components/schemas/Money'
        total:
          $ref: '#/components/schemas/Money'
        invoice:
          anyOf:
          - $ref: '#/components/schemas/OrderInvoice'
          - type: 'null'
        buyer:
          anyOf:
          - $ref: '#/components/schemas/Contact'
          - type: 'null'
        seller:
          anyOf:
          - $ref: '#/components/schemas/Contact'
          - type: 'null'
    CustomsDocumentRef:
      type: object
      properties:
        type:
          type: string
        carrier_reference:
          type: string
        document_upload:
          type: string
      required:
      - type
    CustomsDeclaration:
      type: object
      properties:
        contents_type:
          type: string
          enum:
          - merchandise
          - gift
          - sample
          - documents
          - returned_goods
          - repair
          - personal_effects
          - other
        contents_explanation:
          type: string
        incoterm:
          type: string
          enum:
          - DAP
          - DDP
          - DDU
          - EXW
          - FCA
          - CPT
          - CIP
          - DPU
        duties:
          type: object
          properties:
            paid_by:
              type: string
              enum:
              - sender
              - recipient
              - third_party
            account_number:
              anyOf:
              - type: string
              - type: 'null'
            bill_to:
              anyOf:
              - $ref: '#/components/schemas/Contact'
              - type: 'null'
        landed_cost:
          anyOf:
          - type: string
          - type: 'null'
        import_broker:
          anyOf:
          - $ref: '#/components/schemas/Contact'
          - type: 'null'
        export_broker:
          anyOf:
          - $ref: '#/components/schemas/Contact'
          - type: 'null'
        importer_of_record:
          anyOf:
          - $ref: '#/components/schemas/Contact'
          - type: 'null'
        exporter_of_record:
          anyOf:
          - $ref: '#/components/schemas/Contact'
          - type: 'null'
        eu_responsible_person:
          anyOf:
          - $ref: '#/components/schemas/Contact'
          - type: 'null'
        export_declaration:
          anyOf:
          - type: object
            properties:
              type:
                type: string
                enum:
                - itn
                - eel_pfc
                - mrn
                - ead
              value:
                type: string
          - type: 'null'
        non_delivery:
          type: string
          enum:
          - return
          - abandon
        paperless_trade:
          type: boolean
        certify:
          type: boolean
        signer:
          type: string
        documents:
          type: array
          items:
            $ref: '#/components/schemas/CustomsDocumentRef'
      additionalProperties: false
      required:
      - contents_type
    Billing:
      type: object
      properties:
        paid_by:
          type: string
          enum:
          - sender
          - recipient
          - third_party
          default: sender
        account_number:
          anyOf:
          - type: string
          - type: 'null'
      description: Which carrier account pays transportation charges. The party is `bill_to`. Country and postal code for validation come from
        `bill_to.address`.
    StandardFeatures:
      type: object
      properties:
        signature:
          type: string
          enum:
          - none
          - standard
          - indirect
          - adult
        age_verification:
          type: integer
          minimum: 0
        insurance:
          type: object
          properties:
            amount:
              type: integer
            currency:
              type: string
          required:
          - amount
