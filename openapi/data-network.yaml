      - $ref: '#/components/parameters/ShippingAccount'
      - $ref: '#/components/parameters/Query'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Expand'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    enum:
                    - search_result
                  has_more:
                    type: boolean
                  next_page:
                    anyOf:
                    - type: string
                    - type: 'null'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Shipment'
                required:
                - object
                - has_more
