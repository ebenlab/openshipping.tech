openapi: 3.1.0
info:
  title: 'Open Logistics Specs: Data Network mode'
  version: 0.1.0-draft
  summary: An open, carrier-agnostic shipping API specification.
  description: 'The REST Interface as implemented in **Data Network mode**, for nodes of the shared, verifiable logistics data network. It contains
    only the modules this mode supports (spec/12-modes.md §2); the complete document is `/openapi.yaml`.


    | Module | In this mode |

    |---|---|

    | `core` | Required, read-only |

    | `webhooks` | Required |

    | `platform` | Required |

    | `jobs` | Required |

    | `data_network` | Required |


    Draft 0.1 (2026-10-06). See README.md and spec/*.md for normative text; this document is the machine-readable reference. Operations marked
    `x-spends-money: true` purchase labels or services and MUST be confirmed by a human when invoked by an agent.'
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  contact:
    name: Shipping Internals
    url: https://shippinginternals.dev
  x-mode: Data Network
servers:
- url: https://api.example.com
  description: Replace with implementer host
security:
- apiKey: []
- oauth2: []
tags:
- name: Rates
  description: 'Module `core`: required, read-only in Data Network mode.'
- name: Shipments
  description: 'Module `core`: required, read-only in Data Network mode.'
- name: Tracking
  description: 'Module `core`: required, read-only in Data Network mode.'
- name: Webhooks
  description: 'Module `webhooks`: required in Data Network mode.'
- name: Events
  description: 'Module `core`: required, read-only in Data Network mode.'
- name: Inbound
  description: 'Module `webhooks`: required in Data Network mode.'
- name: Carriers
  description: 'Module `core`: required, read-only in Data Network mode.'
- name: Batches
  description: 'Module `core`: required, read-only in Data Network mode.'
- name: Accounts
  description: 'Module `platform`: required in Data Network mode.'
- name: Data Network
  description: 'Module `data_network`: required in Data Network mode.'
- name: Jobs
  description: 'Module `jobs`: required in Data Network mode.'
- name: Discovery
  description: 'Module `core`: required, read-only in Data Network mode.'
paths:
  /v1/rate_quotes/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Rates
      operationId: rate_quotes.retrieve
      summary: Retrieve a rate quote
      parameters:
      - $ref: '#/components/parameters/ShippingVersion'
      - $ref: '#/components/parameters/ShippingAccount'
      - $ref: '#/components/parameters/Expand'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateQuote'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - apiKey: []
      - oauth2:
        - rates:read
  /v1/shipments:
    get:
      tags:
      - Shipments
      operationId: shipments.list
      summary: List shipments
      parameters:
      - $ref: '#/components/parameters/ShippingVersion'
      - $ref: '#/components/parameters/ShippingAccount'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/StartingAfter'
      - $ref: '#/components/parameters/EndingBefore'
      - $ref: '#/components/parameters/Expand'
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/ShipmentStatus'
      - name: tracking.status
        in: query
        schema:
          $ref: '#/components/schemas/TrackingStatus'
      - name: carrier
        in: query
        schema:
          type: string
      - name: connection
        in: query
        schema:
          type: string
      - name: purchase.service.code
        in: query
        schema:
          type: string
      - name: tracking.number
        in: query
        schema:
          type: string
      - name: reference
        in: query
        schema:
          type: string
      - name: order.id
        in: query
        schema:
          type: string
      - name: returns.is_return
        in: query
        schema:
          type: boolean
      - name: handover.manifest
        in: query
        schema:
          type: string
        description: ID or `none`
      - name: handover.pickup
        in: query
        schema:
          type: string
        description: ID or `none`
      - name: handover.close_group
        in: query
        schema:
          type: string
      - name: ship_date[gte]
        in: query
        schema:
          type: string
          format: date
      - name: ship_date[lte]
        in: query
        schema:
          type: string
          format: date
      - name: created[gte]
        in: query
        schema:
          type: integer
      - name: created[lte]
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    enum:
                    - list
                  url:
                    type: string
                  has_more:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Shipment'
                required:
                - object
                - has_more
                - data
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      security:
      - apiKey: []
      - oauth2:
        - shipments:read
  /v1/shipments/search:
    get:
