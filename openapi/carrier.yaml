webhooks:
  event:
    post:
      summary: Event delivery to a webhook endpoint
      parameters:
      - name: Shipping-Signature
        in: header
        required: true
        schema:
          type: string
        description: t=<unix>,v1=<hex hmac-sha256 of '{t}.{raw_body}'>[,v1a=<ed25519>]
      - name: Shipping-Event-Id
        in: header
        required: true
        schema:
          type: string
      - name: Shipping-Event-Type
        in: header
        required: true
        schema:
          type: string
      - name: Shipping-Delivery-Id
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        2XX:
          description: Acknowledged
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: sk_test_ / sk_live_ / rk_test_ / rk_live_ keys
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://api.example.com/oauth/authorize
          tokenUrl: https://api.example.com/oauth/token
          refreshUrl: https://api.example.com/oauth/token
          scopes:
            rates:read: rates:read
            shipments:read: shipments:read
            shipments:write: shipments:write
            pickups:read: pickups:read
            pickups:write: pickups:write
            manifests:read: manifests:read
            manifests:write: manifests:write
            documents:read: documents:read
            documents:write: documents:write
            trackers:read: trackers:read
            trackers:write: trackers:write
            webhooks:read: webhooks:read
            webhooks:write: webhooks:write
            connections:read: connections:read
            connections:write: connections:write
            inbound:read: inbound:read
            inbound:write: inbound:write
            trade:read: trade:read
            trade:write: trade:write
            catalog:read: catalog:read
            catalog:write: catalog:write
            pricing:read: pricing:read
            pricing:write: pricing:write
            routes:read: routes:read
            routes:write: routes:write
            fleet:read: fleet:read
            fleet:write: fleet:write
            injection:read: injection:read
            injection:write: injection:write
            accounts:read: accounts:read
            accounts:write: accounts:write
            products:read: products:read
            products:write: products:write
            network:read: network:read
            network:write: network:write
            iot:read: iot:read
            iot:write: iot:write
            data:read: data:read
            data:write: data:write
            consolidation:read: consolidation:read
            consolidation:write: consolidation:write
            templates:read: templates:read
            templates:write: templates:write
            integrations:read: integrations:read
            integrations:write: integrations:write
            jobs:read: jobs:read
            jobs:write: jobs:write
            billing:read: billing:read
            billing:write: billing:write
            inventory:read: inventory:read
            inventory:write: inventory:write
            openid: openid
            profile: profile
            email: email
        clientCredentials:
          tokenUrl: https://api.example.com/oauth/token
          scopes: {}
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://api.example.com/.well-known/openid-configuration
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    StartingAfter:
      name: starting_after
      in: query
      schema:
        type: string
    EndingBefore:
      name: ending_before
      in: query
      schema:
        type: string
    Expand:
      name: expand[]
      in: query
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema:
        type: string
        maxLength: 255
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 255
    ShippingVersion:
      name: Shipping-Version
      in: header
      schema:
        type: string
      example: '2026-10-01'
    ShippingAccount:
      name: Shipping-Account
      in: header
      schema:
        type: string
      description: Act on behalf of a connected account (acct_...)
    Query:
      name: query
      in: query
      required: true
      schema:
        type: string
      description: Search query language (chapter 10 §3)
    Page:
      name: page
      in: query
      schema:
        type: string
  responses:
    BadRequest:
      description: invalid_request_error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: authentication_error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: permission_error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: resource_missing
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: idempotency_error or state_error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CarrierError:
      description: carrier_error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: rate_limit_error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CarrierUnavailable:
      description: carrier_unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    CarrierMetadata:
      type: object
      properties: {}
      additionalProperties: true
      readOnly: true
      description: Read-only. Carrier-returned data not modelled by the spec (routing codes, internal IDs). Untrusted and unversioned; keys may
        change with the carrier's API.
    SystemMetadata:
      type: object
      properties:
        source:
          type: string
          enum:
          - api
          - dashboard
          - batch
          - inbound
          - automation
          - system
        created_by:
          type: object
          properties:
            type:
              type: string
              enum:
              - api_key
              - oauth_app
              - user
              - system
            id:
              type: string
        request_id:
          anyOf:
          - type: string
          - type: 'null'
        idempotency_key:
          anyOf:
          - type: string
          - type: 'null'
        batch:
          anyOf:
          - type: string
          - type: 'null'
        generated:
          type: boolean
        test_scenario:
          anyOf:
          - type: string
          - type: 'null'
      additionalProperties: true
      readOnly: true
      description: Read-only. Implementer provenance. Implementer-specific keys are prefixed x_.
    UserMetadata:
      type: object
      properties: {}
      additionalProperties:
        type: string
        maxLength: 500
      maxProperties: 50
      description: Client-writable. Up to 50 string key/value pairs. Never sent to carriers.
    Money:
      type: object
      properties:
        amount:
          type: integer
          description: Minor units (ISO 4217 exponent)
        currency:
          type: string
          pattern: ^[a-z]{3}$
          examples:
          - usd
      required:
      - amount
      - currency
    Weight:
      type: object
      properties:
        value:
          type: number
          exclusiveMinimum: 0
        unit:
          type: string
          enum:
          - g
          - kg
          - oz
          - lb
      required:
      - value
      - unit
    Dimensions:
      type: object
      properties:
        length:
          type: number
        width:
          type: number
        height:
          type: number
        unit:
          type: string
          enum:
          - mm
          - cm
          - in
      required:
      - length
      - width
      - height
      - unit
    Message:
      type: object
      properties:
        level:
          type: string
          enum:
          - info
          - warning
        code:
          type: string
        message:
          type: string
        param:
          type: string
        carrier:
          type: string
      required:
      - level
      - code
      - message
    Messages:
      type: array
      items:
        $ref: '#/components/schemas/Message'
    TaxId:
      type: object
      properties:
        type:
          type: string
          enum:
          - eori
          - vat
          - ioss
          - voec
          - gst
          - ein
          - ssn_last4
          - cpf
          - cnpj
          - rfc
          - abn
          - state_tax_id
          - other
        value:
          type: string
        country:
          type: string
      required:
      - type
      - value
    Address:
      type: object
      properties:
        line1:
          type: string
          description: Street. Street name only when street_number is set; otherwise street and number. No city/state/postal code.
        street_number:
          type: string
          description: House/building number incl. suffix (10, 221B, 12-14). Recommended for DE, NL, BE, AT, CH, PL, BR.
        line2:
          type: string
          description: Apartment, suite, floor, building, c/o
        city:
          type: string
        state:
          type: string
          description: ISO 3166-2 subdivision without country prefix
        postal_code:
          type: string
        country:
          type: string
          pattern: ^[A-Z]{2}$
        residential:
          anyOf:
          - type: boolean
          - type: 'null'
        validation:
          anyOf:
          - type: object
            properties:
              status:
                type: string
                enum:
                - verified
                - corrected
                - unverified
                - invalid
              suggested:
                $ref: '#/components/schemas/Address'
              messages:
                $ref: '#/components/schemas/Messages'
            readOnly: true
          - type: 'null'
      required:
      - line1
      - country
    Contact:
      type: object
      properties:
        name:
          type: string
        company:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          description: E.164
        tax_ids:
          type: array
          items:
            $ref: '#/components/schemas/TaxId'
        address:
          $ref: '#/components/schemas/Address'
        instructions:
          type: string
          maxLength: 255
        access_point:
          anyOf:
          - type: object
            properties:
              carrier:
                type: string
              id:
                type: string
              type:
                type: string
                enum:
                - locker
                - parcel_shop
                - post_office
          - type: 'null'
      description: A party to a shipment. Either `name` or `company` is required. `address` is required on ship_from, ship_to, return_to, bill_to.
    DangerousGoods:
      type: object
      properties:
        class:
          type: string
        un_number:
          type: string
          pattern: ^UN[0-9]{4}$
        proper_shipping_name:
          type: string
        packing_group:
          anyOf:
          - type: string
            enum:
            - I
            - II
            - III
