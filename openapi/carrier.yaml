openapi: 3.1.0
info:
  title: 'Open Logistics Specs: Carrier mode'
  version: 0.1.0-draft
  summary: An open, carrier-agnostic shipping API specification.
  description: 'The REST Interface as implemented in **Carrier mode**, for parcel carriers, postal operators and cross-border networks selling
    their own network. It contains only the modules this mode supports (spec/12-modes.md §2); the complete document is `/openapi.yaml`.


    | Module | In this mode |

    |---|---|

    | `core` | Required |

    | `webhooks` | Required |

    | `pickups` | Required |

    | `manifests` | Optional |

    | `documents` | Optional |

    | `platform` | Required |

    | `catalog` | Required |

    | `pricing` | Required |

    | `trade` | Required |

    | `routes` | Required |

    | `fleet` | Optional |

    | `injection` | Optional |

    | `products` | Optional |

    | `iot` | Optional |

    | `consolidation` | Required |

    | `templates` | Optional |

    | `integrations` | Optional |

    | `jobs` | Required |

    | `inventory` | Optional |

    | `billing` | Required |

    | `data_network` | Optional |


    Draft 0.1 (2026-10-06). See README.md and spec/*.md for normative text; this document is the machine-readable reference. Operations marked
    `x-spends-money: true` purchase labels or services and MUST be confirmed by a human when invoked by an agent.'
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  contact:
    name: Shipping Internals
    url: https://shippinginternals.dev
  x-mode: Carrier
servers:
- url: https://api.example.com
  description: Replace with implementer host
security:
- apiKey: []
- oauth2: []
tags:
- name: Rates
  description: 'Module `core`: required in Carrier mode.'
- name: Shipments
  description: 'Module `core`: required in Carrier mode.'
- name: Pickups
  description: 'Module `pickups`: required in Carrier mode.'
- name: Manifests
  description: 'Module `manifests`: optional in Carrier mode.'
- name: Files
  description: 'Module `documents`: optional in Carrier mode.'
- name: Document Uploads
  description: 'Module `documents`: optional in Carrier mode.'
- name: Tracking
  description: 'Module `core`: required in Carrier mode.'
- name: Webhooks
  description: 'Module `webhooks`: required in Carrier mode.'
- name: Events
  description: 'Module `core`: required in Carrier mode.'
- name: Inbound
  description: 'Module `webhooks`: required in Carrier mode.'
- name: Carriers
  description: 'Module `core`: required in Carrier mode.'
- name: Batches
  description: 'Module `core`: required in Carrier mode.'
- name: Test Helpers
  description: 'Module `core`: required in Carrier mode.'
- name: Pickup Schedules
  description: 'Module `pickups`: required in Carrier mode.'
- name: Trade
  description: 'Module `trade`: required in Carrier mode.'
- name: Catalog
  description: 'Module `catalog`: required in Carrier mode.'
- name: Routes
  description: 'Module `routes`: required in Carrier mode.'
- name: Injection
  description: 'Module `injection`: optional in Carrier mode.'
- name: Accounts
  description: 'Module `platform`: required in Carrier mode.'
- name: Products
  description: 'Module `products`: optional in Carrier mode.'
- name: IoT
  description: 'Module `iot`: optional in Carrier mode.'
- name: Data Network
  description: 'Module `data_network`: optional in Carrier mode.'
- name: Consolidation
  description: 'Module `consolidation`: required in Carrier mode.'
- name: Templates
  description: 'Module `templates`: optional in Carrier mode.'
- name: Integrations
  description: 'Module `integrations`: optional in Carrier mode.'
- name: Jobs
  description: 'Module `jobs`: required in Carrier mode.'
- name: Billing
  description: 'Module `billing`: required in Carrier mode.'
- name: Inventory
  description: 'Module `inventory`: optional in Carrier mode.'
- name: Discovery
  description: 'Module `core`: required in Carrier mode.'
paths:
  /v1/rates:
    post:
      tags:
      - Rates
      operationId: rates.create
      summary: Get live rates
      parameters:
      - $ref: '#/components/parameters/ShippingVersion'
      - $ref: '#/components/parameters/ShippingAccount'
      description: 'Fans out to every eligible connection. Partial carrier failure returns 200 with `errors[]`. Send `Accept: text/event-stream`
        for streaming (capability rates.stream).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateQuote'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      security:
      - apiKey: []
      - oauth2:
        - rates:read
  /v1/rate_quotes/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Rates
      operationId: rate_quotes.retrieve
      summary: Retrieve a rate quote
      parameters:
      - $ref: '#/components/parameters/ShippingVersion'
      - $ref: '#/components/parameters/ShippingAccount'
      - $ref: '#/components/parameters/Expand'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateQuote'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - apiKey: []
      - oauth2:
        - rates:read
  /v1/shipments:
    post:
      tags:
      - Shipments
      operationId: shipments.create
      summary: 'Create a shipment (draft, or purchase with `purchase: true`)'
      parameters:
      - $ref: '#/components/parameters/ShippingVersion'
      - $ref: '#/components/parameters/ShippingAccount'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipmentCreate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/CarrierError'
        '502':
          $ref: '#/components/responses/CarrierUnavailable'
        '202':
          description: Purchase in progress (status `purchasing`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
      security:
      - apiKey: []
      - oauth2:
        - shipments:write
      x-spends-money: true
      description: '`Idempotency-Key` is REQUIRED when the body carries a `purchase` instruction.'
    get:
      tags:
      - Shipments
      operationId: shipments.list
      summary: List shipments
      parameters:
      - $ref: '#/components/parameters/ShippingVersion'
      - $ref: '#/components/parameters/ShippingAccount'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/StartingAfter'
      - $ref: '#/components/parameters/EndingBefore'
      - $ref: '#/components/parameters/Expand'
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/ShipmentStatus'
      - name: tracking.status
        in: query
        schema:
          $ref: '#/components/schemas/TrackingStatus'
      - name: carrier
        in: query
        schema:
          type: string
      - name: connection
        in: query
        schema:
          type: string
      - name: purchase.service.code
        in: query
        schema:
          type: string
      - name: tracking.number
        in: query
        schema:
          type: string
      - name: reference
        in: query
        schema:
          type: string
      - name: order.id
        in: query
        schema:
          type: string
      - name: returns.is_return
        in: query
        schema:
          type: boolean
      - name: handover.manifest
        in: query
        schema:
          type: string
        description: ID or `none`
      - name: handover.pickup
        in: query
        schema:
          type: string
        description: ID or `none`
      - name: handover.close_group
        in: query
        schema:
          type: string
      - name: ship_date[gte]
        in: query
        schema:
          type: string
          format: date
      - name: ship_date[lte]
        in: query
        schema:
          type: string
          format: date
      - name: created[gte]
        in: query
        schema:
          type: integer
      - name: created[lte]
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    enum:
                    - list
                  url:
                    type: string
                  has_more:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Shipment'
                required:
                - object
                - has_more
                - data
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      security:
      - apiKey: []
      - oauth2:
        - shipments:read
  /v1/shipments/search:
    get:
      tags:
      - Shipments
      operationId: shipments.search
      summary: Search shipments
      parameters:
      - $ref: '#/components/parameters/ShippingVersion'
      - $ref: '#/components/parameters/ShippingAccount'
      - $ref: '#/components/parameters/Query'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Expand'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    enum:
                    - search_result
                  has_more:
                    type: boolean
                  next_page:
                    anyOf:
                    - type: string
                    - type: 'null'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Shipment'
                required:
                - object
                - has_more
                - data
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      security:
      - apiKey: []
      - oauth2:
        - shipments:read
  /v1/shipments/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Shipments
      operationId: shipments.retrieve
      summary: Retrieve a Shipment
      parameters:
      - $ref: '#/components/parameters/ShippingVersion'
      - $ref: '#/components/parameters/ShippingAccount'
      - $ref: '#/components/parameters/Expand'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - apiKey: []
      - oauth2:
        - shipments:read
    post:
      tags:
      - Shipments
      operationId: shipments.update
      summary: Update a Shipment
      parameters:
      - $ref: '#/components/parameters/ShippingVersion'
      - $ref: '#/components/parameters/ShippingAccount'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipmentUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
      - apiKey: []
      - oauth2:
        - shipments:write
    delete:
      tags:
      - Shipments
      operationId: shipments.delete
      summary: Delete a draft shipment
      parameters:
      - $ref: '#/components/parameters/ShippingVersion'
      - $ref: '#/components/parameters/ShippingAccount'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deleted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
      - apiKey: []
      - oauth2:
        - shipments:write
  /v1/shipments/{id}/purchase:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - Shipments
      operationId: shipments.purchase
      summary: Purchase a label
      parameters:
      - $ref: '#/components/parameters/ShippingVersion'
      - $ref: '#/components/parameters/ShippingAccount'
      - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipmentPurchase'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
        '202':
          description: Purchase in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/CarrierError'
        '502':
          $ref: '#/components/responses/CarrierUnavailable'
      x-spends-money: true
      security:
      - apiKey: []
      - oauth2:
        - shipments:write
  /v1/shipments/{id}/void:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - Shipments
      operationId: shipments.void
      summary: Void a label
      parameters:
      - $ref: '#/components/parameters/ShippingVersion'
      - $ref: '#/components/parameters/ShippingAccount'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipmentVoid'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/CarrierError'
        '502':
          $ref: '#/components/responses/CarrierUnavailable'
      security:
      - apiKey: []
      - oauth2:
        - shipments:write
  /v1/shipments/{id}/rates:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - Shipments
      operationId: shipments.rates
      summary: Re-rate a draft shipment
      parameters:
      - $ref: '#/components/parameters/ShippingVersion'
      - $ref: '#/components/parameters/ShippingAccount'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RateFilters'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateQuote'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/CarrierError'
        '502':
          $ref: '#/components/responses/CarrierUnavailable'
      security:
      - apiKey: []
      - oauth2:
        - shipments:write
  /v1/shipments/{id}/return:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - Shipments
      operationId: shipments.return
      summary: Create a return shipment
      parameters:
      - $ref: '#/components/parameters/ShippingVersion'
      - $ref: '#/components/parameters/ShippingAccount'
      - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipmentReturn'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/CarrierError'
        '502':
          $ref: '#/components/responses/CarrierUnavailable'
      x-spends-money: true
      security:
      - apiKey: []
      - oauth2:
        - shipments:write
  /v1/shipments/{id}/label:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - Shipments
      operationId: shipments.label
      summary: Re-render the label
      parameters:
      - $ref: '#/components/parameters/ShippingVersion'
      - $ref: '#/components/parameters/ShippingAccount'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabelFormat'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/CarrierError'
        '502':
          $ref: '#/components/responses/CarrierUnavailable'
      security:
      - apiKey: []
      - oauth2:
        - shipments:write
  /v1/pickups/availability:
    post:
      tags:
      - Pickups
      operationId: pickups.availability
      summary: Check pickup availability
      parameters:
      - $ref: '#/components/parameters/ShippingVersion'
      - $ref: '#/components/parameters/ShippingAccount'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PickupAvailabilityRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PickupAvailability'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '422':
          $ref: '#/components/responses/CarrierError'
        '502':
          $ref: '#/components/responses/CarrierUnavailable'
      security:
      - apiKey: []
      - oauth2:
        - pickups:write
  /v1/pickups:
    post:
      tags:
      - Pickups
      operationId: pickups.create
      summary: Book a pickup
      parameters:
      - $ref: '#/components/parameters/ShippingVersion'
      - $ref: '#/components/parameters/ShippingAccount'
      - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PickupCreate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pickup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/CarrierError'
        '502':
          $ref: '#/components/responses/CarrierUnavailable'
      x-spends-money: true
      security:
      - apiKey: []
      - oauth2:
        - pickups:write
    get:
      tags:
      - Pickups
      operationId: pickups.list
      summary: List pickups
      parameters:
      - $ref: '#/components/parameters/ShippingVersion'
      - $ref: '#/components/parameters/ShippingAccount'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/StartingAfter'
      - $ref: '#/components/parameters/EndingBefore'
      - $ref: '#/components/parameters/Expand'
      - name: status
        in: query
        schema:
          type: string
      - name: carrier
        in: query
        schema:
          type: string
      - name: connection
        in: query
        schema:
          type: string
      - name: date[gte]
        in: query
        schema:
          type: string
          format: date
      - name: date[lte]
        in: query
        schema:
          type: string
          format: date
      - name: created[gte]
        in: query
        schema:
          type: integer
      - name: created[lte]
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    enum:
                    - list
                  url:
                    type: string
                  has_more:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Pickup'
                required:
                - object
                - has_more
                - data
        '400':
